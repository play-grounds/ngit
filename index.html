    <script type="module">
        import { render } from 'preact';
        import { useState, useEffect, useMemo, useRef } from 'preact/hooks';
        import { html } from 'htm/preact';

        const RELAYS = [
            'wss://relay.nostr.net/',
            'wss://nos.lol/',
            'wss://relay.damus.io/',
            'wss://nostr.wine/',
            'wss://relay.snort.social/',
            'wss://nostr.mom/',
            'wss://relay.nostr.band/',
            'wss://purplepag.es/',
            'wss://offchain.pub/'
        ];
        const REPO_KIND = 30617;

        // ---------- helpers ----------

        // Minimal bech32 encoder for npub display
        const BECH32 = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
        const polymod = (values) => {
            const GEN = [0x3b6a57b2, 0x26508e6d, 0x1ea119fa, 0x3d4233dd, 0x2a1462b3];
            let chk = 1;
            for (const v of values) {
                const top = chk >> 25;
                chk = ((chk & 0x1ffffff) << 5) ^ v;
                for (let i = 0; i < 5; i++) if ((top >> i) & 1) chk ^= GEN[i];
            }
            return chk;
        };
        const npubCache = new Map();
        const toNpub = (hex) => {
            if (npubCache.has(hex)) return npubCache.get(hex);
            if (!/^[0-9a-f]{64}$/i.test(hex)) return hex;
            const bytes = hex.match(/../g).map(b => parseInt(b, 16));
            const words = [];
            let acc = 0, bits = 0;
            for (const b of bytes) {
                acc = (acc << 8) | b; bits += 8;
                while (bits >= 5) { bits -= 5; words.push((acc >> bits) & 31); }
            }
            if (bits > 0) words.push((acc << (5 - bits)) & 31);
            const hrp = 'npub';
            const expanded = [...[...hrp].map(c => c.charCodeAt(0) >> 5), 0, ...[...hrp].map(c => c.charCodeAt(0) & 31)];
            const mod = polymod([...expanded, ...words, 0, 0, 0, 0, 0, 0]) ^ 1;
            const checksum = Array.from({ length: 6 }, (_, i) => (mod >> (5 * (5 - i))) & 31);
            const out = hrp + '1' + [...words, ...checksum].map(w => BECH32[w]).join('');
            npubCache.set(hex, out);
            return out;
        };
        const shortNpub = (hex) => {
            const n = toNpub(hex);
            return n.length > 20 ? `${n.slice(0, 10)}…${n.slice(-4)}` : n;
        };

        const hue = (str) => {
            let h = 0;
            for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
            return h % 360;
        };
        const gradientFor = (str) => {
            const h = hue(str);
            return `linear-gradient(135deg, hsl(${h} 70% 58%), hsl(${(h + 40) % 360} 70% 48%))`;
        };

        // Only allow http(s) links from untrusted event data
        const safeUrl = (url) => {
            try {
                const u = new URL(url);
                return u.protocol === 'http:' || u.protocol === 'https:' ? u.href : null;
            } catch { return null; }
        };

        const timeAgo = (ts) => {
            const s = Math.max(0, Date.now() / 1000 - ts);
            const units = [[31536000, 'y'], [2592000, 'mo'], [604800, 'w'], [86400, 'd'], [3600, 'h'], [60, 'm']];
            for (const [secs, label] of units) {
                if (s >= secs) return `${Math.floor(s / secs)}${label} ago`;
            }
            return 'just now';
        };

        const tagValue = (event, name) => event.tags?.find(t => t[0] === name)?.[1];
        const repoKey = (event) => `${event.pubkey}:${tagValue(event, 'd') || ''}`;

        // NIP-34 repository announcement
        const parseRepo = (event) => {
            const tags = event.tags || [];
            const all = (name) => tags.filter(t => t[0] === name).flatMap(t => t.slice(1)).filter(Boolean);
            const d = tagValue(event, 'd') || '';
            const maintainers = [...new Set([
                ...all('maintainers'),
                ...tags.filter(t => t[0] === 'p').map(t => t[1]).filter(Boolean)
            ])].filter(pk => pk !== event.pubkey && /^[0-9a-f]{64}$/i.test(pk));
            return {
                d,
                name: tagValue(event, 'name') || d || 'untitled',
                description: tagValue(event, 'description') || event.content || '',
                clone: all('clone'),
                web: all('web').map(safeUrl).filter(Boolean),
                hashtags: [...new Set(all('t'))],
                maintainers
            };
        };

        const matchesFilter = (event, filter) => {
            if (filter.startsWith('pubkey=')) {
                const pk = filter.slice('pubkey='.length);
                return event.pubkey === pk;
            }
            return event.tags?.some(tag => `${tag[0]}=${tag[1] || ''}` === filter);
        };

        const readURLState = () => {
            const params = new URLSearchParams(window.location.search);
            const filter = params.get('filter');
            return {
                filters: new Set(filter ? filter.split(',').filter(Boolean) : []),
                query: params.get('q') || ''
            };
        };

        // ---------- relay pool ----------

        function createPool({ onEvent, onStatus }) {
            const sockets = new Map();
            const profileQueue = new Set();
            const requestedProfiles = new Set();
            let profileTimer = null;
            let subCounter = 0;
            let closed = false;

            const sendTo = (ws, msg) => {
                if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
            };

            const requestProfiles = (ws, pubkeys) => {
                for (let i = 0; i < pubkeys.length; i += 100) {
                    sendTo(ws, ['REQ', `prof-${++subCounter}`, { kinds: [0], authors: pubkeys.slice(i, i + 100) }]);
                }
            };

            const connect = (url, attempt = 0) => {
                if (closed) return;
                onStatus(url, 'connecting');
                let ws;
                try { ws = new WebSocket(url); } catch { onStatus(url, 'error'); return; }
                sockets.set(url, ws);

                ws.onopen = () => {
                    attempt = 0;
                    onStatus(url, 'open');
                    sendTo(ws, ['REQ', 'repos', { kinds: [REPO_KIND], limit: 200 }]);
                    if (requestedProfiles.size) requestProfiles(ws, [...requestedProfiles]);
                };

                ws.onmessage = (msg) => {
                    let data;
                    try { data = JSON.parse(msg.data); } catch { return; }
                    if (data[0] === 'EVENT' && data[2]) {
                        onEvent(data[2]);
                    } else if (data[0] === 'EOSE' && String(data[1]).startsWith('prof-')) {
                        sendTo(ws, ['CLOSE', data[1]]);
                    }
                };

                ws.onclose = () => {
                    if (sockets.get(url) !== ws) return;
                    onStatus(url, 'error');
                    if (closed) return;
                    const delay = Math.min(60000, 5000 * 2 ** attempt);
                    setTimeout(() => connect(url, attempt + 1), delay);
                };
            };

            RELAYS.forEach(url => connect(url));

            return {
                wantProfiles(pubkeys) {
                    for (const pk of pubkeys) {
                        if (!requestedProfiles.has(pk)) profileQueue.add(pk);
                    }
                    if (!profileQueue.size || profileTimer) return;
                    profileTimer = setTimeout(() => {
                        profileTimer = null;
                        const batch = [...profileQueue];
                        profileQueue.clear();
                        batch.forEach(pk => requestedProfiles.add(pk));
                        sockets.forEach(ws => requestProfiles(ws, batch));
                    }, 400);
                },
                close() {
                    closed = true;
                    sockets.forEach(ws => ws.close());
                }
            };
        }

        // ---------- components ----------

        const Icon = {
            search: html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`,
            copy: html`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>`,
            check: html`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
            globe: html`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>`
        };

        function Avatar({ pubkey, profile, small }) {
            const [broken, setBroken] = useState(false);
            const src = profile?.picture && safeUrl(profile.picture);
            const cls = `avatar${small ? ' sm' : ''}`;
            if (src && !broken) {
                return html`<img class=${cls} src=${src} alt="" loading="lazy" referrerpolicy="no-referrer" onError=${() => setBroken(true)} />`;
            }
            return html`<span class=${cls} style=${{ background: gradientFor(pubkey) }}></span>`;
        }

        const displayName = (pubkey, profile) =>
            profile?.display_name || profile?.displayName || profile?.name || shortNpub(pubkey);

        function CopyButton({ text }) {
            const [copied, setCopied] = useState(false);
            const copy = async () => {
                try {
                    await navigator.clipboard.writeText(text);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 1500);
                } catch {}
            };
            return html`
                <button class=${copied ? 'copied' : ''} onClick=${copy} title="Copy clone URL">
                    ${copied ? Icon.check : Icon.copy} ${copied ? 'Copied' : 'Copy'}
                </button>
            `;
        }

        function RepoCard({ event, profiles, activeFilters, toggleFilter }) {
            const repo = useMemo(() => parseRepo(event), [event]);
            const ownerProfile = profiles[event.pubkey];
            const ownerFilter = `pubkey=${event.pubkey}`;
            const shownMaintainers = repo.maintainers.slice(0, 4);
            const website = repo.web[0];

            return html`
                <article class="card">
                    <div class="card-head">
                        <div class="repo-icon" style=${{ background: gradientFor(repoKey(event)) }}>
                            ${repo.name.replace(/[^a-z0-9]/gi, '').charAt(0) || '#'}
                        </div>
                        <div class="card-title">
                            <h2>
                                ${website
                                    ? html`<a href=${website} target="_blank" rel="noopener noreferrer">${repo.name}</a>`
                                    : repo.name}
                            </h2>
                            ${repo.d && repo.d !== repo.name && html`<div class="d" title="d tag">${repo.d}</div>`}
                        </div>
                        <time class="time" datetime=${new Date(event.created_at * 1000).toISOString()}
                              title=${new Date(event.created_at * 1000).toLocaleString()}>
                            ${timeAgo(event.created_at)}
                        </time>
                    </div>

                    ${repo.description
                        ? html`<p class="desc" title=${repo.description}>${repo.description}</p>`
                        : html`<p class="desc none">No description</p>`}

                    ${repo.clone[0] && html`
                        <div class="clone">
                            <code title=${repo.clone[0]}>${repo.clone[0]}</code>
                            <${CopyButton} text=${repo.clone[0]} />
                        </div>
                    `}

                    ${repo.web.length > 0 && html`
                        <div class="links">
                            ${repo.web.slice(0, 3).map(url => html`
                                <a key=${url} href=${url} target="_blank" rel="noopener noreferrer" title=${url}>
                                    ${Icon.globe}<span>${url.replace(/^https?:\/\//, '').replace(/\/$/, '')}</span>
                                </a>
                            `)}
                        </div>
                    `}

                    ${repo.hashtags.length > 0 && html`
                        <div class="chips">
                            ${repo.hashtags.map(t => {
                                const f = `t=${t}`;
                                return html`
                                    <button key=${t} class="chip ${activeFilters.has(f) ? 'active' : ''}" onClick=${() => toggleFilter(f)}>
                                        #${t}
                                    </button>
                                `;
                            })}
                        </div>
                    `}

                    <details class="raw">
                        <summary>${event.tags?.length || 0} tags</summary>
                        <div class="chips">
                            ${(event.tags || []).map((tag, i) => {
                                const f = `${tag[0]}=${tag[1] || ''}`;
                                const val = tag[1] || '';
                                return html`
                                    <button key=${i} class="chip mono ${activeFilters.has(f) ? 'active' : ''}"
                                            title=${tag.join(' ')} onClick=${() => toggleFilter(f)}>
                                        ${tag[0]}: ${val.length > 24 ? val.slice(0, 24) + '…' : val}
                                    </button>
                                `;
                            })}
                        </div>
                    </details>

                    <div class="card-foot">
                        <button class="person ${activeFilters.has(ownerFilter) ? 'active' : ''}"
                                title=${`Filter by ${toNpub(event.pubkey)}`}
                                onClick=${() => toggleFilter(ownerFilter)}>
                            <${Avatar} pubkey=${event.pubkey} profile=${ownerProfile} />
                            <span style="min-width:0">
                                <span class="person-name">${displayName(event.pubkey, ownerProfile)}</span>
                                <span class="person-npub">${shortNpub(event.pubkey)}</span>
                            </span>
                        </button>
                        ${shownMaintainers.length > 0 && html`
                            <div class="maintainers">
                                ${shownMaintainers.map(pk => html`
                                    <button key=${pk} class="person" onClick=${() => toggleFilter(`pubkey=${pk}`)}
                                            title=${`Maintainer: ${displayName(pk, profiles[pk])} (click to filter)`}>
                                        <${Avatar} pubkey=${pk} profile=${profiles[pk]} small />
                                    </button>
                                `)}
                                ${repo.maintainers.length > shownMaintainers.length && html`
                                    <span class="more">+${repo.maintainers.length - shownMaintainers.length}</span>
                                `}
                            </div>
                        `}
                    </div>
                </article>
            `;
        }

        function RelayStatus({ relayStatus }) {
            const [open, setOpen] = useState(false);
            const ref = useRef();
            const entries = Object.entries(relayStatus);
            const ok = entries.filter(([, s]) => s === 'open').length;
            const dot = ok > 0 ? 'ok' : entries.some(([, s]) => s === 'connecting') ? 'warn' : 'bad';

            useEffect(() => {
                const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
                document.addEventListener('click', onDoc);
                return () => document.removeEventListener('click', onDoc);
            }, []);

            return html`
                <div class="relay-pill" ref=${ref}>
                    <button onClick=${() => setOpen(!open)} aria-expanded=${open}>
                        <span class="dot ${dot}"></span>
                        ${ok}/${RELAYS.length} relays
                    </button>
                    ${open && html`
                        <div class="relay-menu">
                            ${RELAYS.map(url => {
                                const s = relayStatus[url];
                                const cls = s === 'open' ? 'ok' : s === 'connecting' ? 'warn' : 'bad';
                                return html`<div key=${url}><span class="dot ${cls}"></span>${url.replace(/^wss:\/\/|\/$/g, '')}</div>`;
                            })}
                        </div>
                    `}
                </div>
            `;
        }

        function App() {
            const initial = useMemo(readURLState, []);
            const [repos, setRepos] = useState([]);
            const [profiles, setProfiles] = useState({});
            const [relayStatus, setRelayStatus] = useState({});
            const [activeFilters, setActiveFilters] = useState(initial.filters);
            const [query, setQuery] = useState(initial.query);
            const [sort, setSort] = useState('recent');
            const poolRef = useRef();
            const searchRef = useRef();

            useEffect(() => {
                const repoMap = new Map();
                const profileMap = {};
                let flushQueued = false;

                // Batch state updates so a burst of relay events renders once per frame
                const flush = () => {
                    if (flushQueued) return;
                    flushQueued = true;
                    requestAnimationFrame(() => {
                        flushQueued = false;
                        setRepos([...repoMap.values()]);
                        setProfiles({ ...profileMap });
                    });
                };

                const onEvent = (ev) => {
                    if (ev.kind === REPO_KIND) {
                        const key = repoKey(ev);
                        const prev = repoMap.get(key);
                        if (prev && prev.created_at >= ev.created_at) return;
                        repoMap.set(key, ev);
                        poolRef.current?.wantProfiles([ev.pubkey, ...parseRepo(ev).maintainers]);
                        flush();
                    } else if (ev.kind === 0) {
                        const prev = profileMap[ev.pubkey];
                        if (prev && prev._at >= ev.created_at) return;
                        try {
                            profileMap[ev.pubkey] = { ...JSON.parse(ev.content), _at: ev.created_at };
                            flush();
                        } catch {}
                    }
                };

                const onStatus = (url, s) => setRelayStatus(prev => ({ ...prev, [url]: s }));

                poolRef.current = createPool({ onEvent, onStatus });

                const onPop = () => {
                    const s = readURLState();
                    setActiveFilters(s.filters);
                    setQuery(s.query);
                };
                const onKey = (e) => {
                    if (e.key === '/' && document.activeElement !== searchRef.current) {
                        e.preventDefault();
                        searchRef.current?.focus();
                    } else if (e.key === 'Escape' && document.activeElement === searchRef.current) {
                        searchRef.current.blur();
                    }
                };
                window.addEventListener('popstate', onPop);
                window.addEventListener('keydown', onKey);

                return () => {
                    poolRef.current.close();
                    window.removeEventListener('popstate', onPop);
                    window.removeEventListener('keydown', onKey);
                };
            }, []);

            const updateURL = (filters, q, push = true) => {
                const url = new URL(window.location);
                if (filters.size > 0) url.searchParams.set('filter', [...filters].join(','));
                else url.searchParams.delete('filter');
                if (q) url.searchParams.set('q', q);
                else url.searchParams.delete('q');
                window.history[push ? 'pushState' : 'replaceState']({}, '', url);
            };

            const toggleFilter = (filter) => {
                const next = new Set(activeFilters);
                next.has(filter) ? next.delete(filter) : next.add(filter);
                setActiveFilters(next);
                updateURL(next, query);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const clearFilters = () => {
                setActiveFilters(new Set());
                setQuery('');
                updateURL(new Set(), '');
            };

            const onSearch = (e) => {
                setQuery(e.target.value);
                updateURL(activeFilters, e.target.value, false);
            };

            const visible = useMemo(() => {
                const q = query.trim().toLowerCase();
                const list = repos.filter(ev => {
                    if (![...activeFilters].every(f => matchesFilter(ev, f))) return false;
                    if (!q) return true;
                    const r = parseRepo(ev);
                    const owner = profiles[ev.pubkey];
                    const haystack = [
                        r.name, r.d, r.description, ...r.hashtags, ...r.clone, ...r.web,
                        owner?.name, owner?.display_name, owner?.nip05, toNpub(ev.pubkey)
                    ].filter(Boolean).join(' ').toLowerCase();
                    return haystack.includes(q);
                });
                if (sort === 'name') {
                    return list.sort((a, b) => parseRepo(a).name.localeCompare(parseRepo(b).name, undefined, { sensitivity: 'base' }));
                }
                return list.sort((a, b) => b.created_at - a.created_at);
            }, [repos, activeFilters, query, sort, profiles]);

            const authors = useMemo(() => new Set(repos.map(r => r.pubkey)).size, [repos]);
            const connected = Object.values(relayStatus).filter(s => s === 'open').length;
            const loading = repos.length === 0;
            const filtering = activeFilters.size > 0 || query;

            const filterLabel = (f) => {
                if (f.startsWith('pubkey=')) {
                    const pk = f.slice(7);
                    return `by ${displayName(pk, profiles[pk])}`;
                }
                if (f.startsWith('t=')) return `#${f.slice(2)}`;
                return f.length > 40 ? f.slice(0, 40) + '…' : f;
            };

            return html`
                <header class="topbar">
                    <div class="topbar-inner">
                        <a class="brand" href="./" onClick=${(e) => { e.preventDefault(); clearFilters(); }}>
                            <img src="favicon.svg" alt="" />
                            ngit <small>NIP-34 explorer</small>
                        </a>
                        <div class="spacer"></div>
                        <${RelayStatus} relayStatus=${relayStatus} />
                    </div>
                </header>

                <main class="container">
                    <section class="hero">
                        <h1>Git repositories on <span>Nostr</span></h1>
                        <p>A live feed of repository announcements (NIP-34, kind 30617) streamed from public relays. Click a hashtag, tag or person to filter.</p>
                        <div class="stats">
                            <div class="stat"><b>${repos.length}</b><span>repositories</span></div>
                            <div class="stat"><b>${authors}</b><span>authors</span></div>
                            <div class="stat"><b>${connected}</b><span>relays connected</span></div>
                        </div>
                    </section>

                    <div class="toolbar">
                        <label class="search">
                            ${Icon.search}
                            <input ref=${searchRef} type="search" placeholder="Search name, description, author, clone URL…"
                                   value=${query} onInput=${onSearch} aria-label="Search repositories" />
                            ${!query && html`<kbd>/</kbd>`}
                        </label>
                        <div class="segmented" role="group" aria-label="Sort">
                            <button aria-pressed=${sort === 'recent'} onClick=${() => setSort('recent')}>Recent</button>
                            <button aria-pressed=${sort === 'name'} onClick=${() => setSort('name')}>A–Z</button>
                        </div>
                    </div>

                    ${filtering && html`
                        <div class="filters">
                            <span>Showing ${visible.length} of ${repos.length}</span>
                            ${[...activeFilters].map(f => html`
                                <button key=${f} class="chip active" title=${`${f} (click to remove)`} onClick=${() => toggleFilter(f)}>
                                    ${filterLabel(f)} <span class="x">×</span>
                                </button>
                            `)}
                            <button class="link-btn" onClick=${clearFilters}>Clear all</button>
                        </div>
                    `}

                    <div class="grid">
                        ${loading && [0, 1, 2, 3, 4, 5].map(i => html`<div key=${i} class="skeleton"></div>`)}
                        ${!loading && visible.length === 0 && html`
                            <div class="empty">
                                <h3>No matching repositories</h3>
                                <p>Try a different search, or <button class="link-btn" onClick=${clearFilters}>clear filters</button>.</p>
                            </div>
                        `}
                        ${visible.map(ev => html`
                            <${RepoCard} key=${repoKey(ev)} event=${ev} profiles=${profiles}
                                         activeFilters=${activeFilters} toggleFilter=${toggleFilter} />
                        `)}
                    </div>

                    <footer>
                        Open source on <a href="https://github.com/play-grounds/ngit" target="_blank" rel="noopener noreferrer">GitHub</a>${' · '}Learn about <a href="https://github.com/nostr-protocol/nips/blob/master/34.md" target="_blank" rel="noopener noreferrer">NIP-34</a>
                    </footer>
                </main>
            `;
        }

        render(html`<${App} />`, document.getElementById('app'));
    </script>
</body>
</html>
