<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIP-34 Event Viewer</title>
    <script type="importmap">
    {
        "imports": {
            "preact": "https://esm.sh/preact@10.19.3",
            "preact/hooks": "https://esm.sh/preact@10.19.3/hooks",
            "htm/preact": "https://esm.sh/htm@3.1.1/preact"
        }
    }
    </script>
    <style>
        :root {
            --primary-bg: #faf9f8;
            --secondary-bg: #f5f3f0;
            --card-bg: #ffffff;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --text-muted: #a0aec0;
            --accent-primary: #667eea;
            --accent-secondary: #764ba2;
            --success: #48bb78;
            --warning: #ed8936;
            --error: #f56565;
            --border: #e2e8f0;
            --shadow: rgba(0, 0, 0, 0.1);
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: var(--primary-bg);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 0;
            background: var(--gradient);
            border-radius: 20px;
            color: white;
            box-shadow: 0 10px 30px var(--shadow);
        }

        .header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .header p {
            margin: 0;
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 400;
        }

        .status {
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            font-weight: 500;
            backdrop-filter: blur(10px);
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .status.connected {
            background: rgba(72, 187, 120, 0.1);
            border-color: rgba(72, 187, 120, 0.2);
            color: var(--success);
        }

        .status.connecting {
            background: rgba(237, 137, 54, 0.1);
            border-color: rgba(237, 137, 54, 0.2);
            color: var(--warning);
        }

        .status.error {
            background: rgba(245, 101, 101, 0.1);
            border-color: rgba(245, 101, 101, 0.2);
            color: var(--error);
        }

        .event {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .event::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient);
        }

        .event:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .event-id {
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            background: var(--secondary-bg);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            word-break: break-all;
            border: 1px solid var(--border);
        }

        .event-time {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .event-content {
            margin-bottom: 1.5rem;
        }

        .repo-info {
            background: var(--secondary-bg);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        .repo-name {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .repo-description {
            color: var(--text-secondary);
            font-style: italic;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .repo-url {
            color: var(--accent-primary);
            text-decoration: none;
            word-break: break-all;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .repo-url:hover {
            color: var(--accent-secondary);
            text-decoration: underline;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .tag {
            background: rgba(102, 126, 234, 0.1);
            color: var(--accent-primary);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: 'SF Mono', monospace;
            border: 1px solid rgba(102, 126, 234, 0.2);
            font-weight: 500;
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .loading h3 {
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .no-events {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .no-events h3 {
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .maintainers {
            margin-top: 1rem;
        }

        .maintainer {
            background: rgba(72, 187, 120, 0.1);
            color: var(--success);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-right: 0.5rem;
            font-family: 'SF Mono', monospace;
            border: 1px solid rgba(72, 187, 120, 0.2);
            font-weight: 500;
            display: inline-block;
            margin-bottom: 0.25rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .event {
                padding: 1.5rem;
            }
            
            .event-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script type="module">
        import { render } from 'preact';
        import { useState, useEffect } from 'preact/hooks';
        import { html } from 'htm/preact';

        function App() {
            const [events, setEvents] = useState([]);
            const [status, setStatus] = useState('connecting');
            const [connections, setConnections] = useState([]);

            useEffect(() => {
                connectToRelays();
                return () => {
                    connections.forEach(conn => {
                        if (conn.ws) {
                            conn.ws.close();
                        }
                    });
                };
            }, []);

            const relays = [
                'wss://relay.nostr.net/',
                'wss://nos.lol/',
                'wss://relay.damus.io/',
                'wss://nostr.wine/',
                'wss://relay.snort.social/',
                'wss://nostr.mom/',
                'wss://relay.nostr.band/',
                'wss://purplepag.es/',
                'wss://relay.current.fyi/',
                'wss://offchain.pub/'
            ];

            const connectToRelays = () => {
                setStatus('connecting');
                const newConnections = [];
                
                relays.forEach((relayUrl, index) => {
                    const websocket = new WebSocket(relayUrl);
                    const conn = { url: relayUrl, ws: websocket, connected: false };
                    
                    websocket.onopen = () => {
                        conn.connected = true;
                        setConnections(prev => {
                            const updated = [...prev];
                            const existing = updated.find(c => c.url === relayUrl);
                            if (existing) {
                                existing.connected = true;
                            } else {
                                updated.push(conn);
                            }
                            return updated;
                        });
                        
                        // Update status if this is the first connection
                        setStatus(prevStatus => prevStatus === 'connecting' ? 'connected' : prevStatus);
                        
                        // Subscribe to NIP-34 events (kind 30617)
                        const subscription = JSON.stringify([
                            "REQ",
                            `nip34-sub-${index}`,
                            {
                                "kinds": [30617],
                                "limit": 50
                            }
                        ]);
                        websocket.send(subscription);
                    };

                    websocket.onmessage = (event) => {
                        try {
                            const message = JSON.parse(event.data);
                            if (message[0] === 'EVENT' && message[2]) {
                                const nostrEvent = message[2];
                                if (nostrEvent.kind === 30617) {
                                    setEvents(prev => {
                                        // Avoid duplicates
                                        const exists = prev.some(e => e.id === nostrEvent.id);
                                        if (exists) return prev;
                                        
                                        const newEvents = [nostrEvent, ...prev];
                                        // Sort by created_at descending
                                        return newEvents.sort((a, b) => b.created_at - a.created_at);
                                    });
                                }
                            }
                        } catch (err) {
                            console.error('Error parsing message:', err);
                        }
                    };

                    websocket.onerror = () => {
                        conn.connected = false;
                        setConnections(prev => {
                            const updated = [...prev];
                            const existing = updated.find(c => c.url === relayUrl);
                            if (existing) {
                                existing.connected = false;
                            }
                            return updated;
                        });
                    };

                    websocket.onclose = () => {
                        conn.connected = false;
                        setConnections(prev => {
                            const updated = [...prev];
                            const existing = updated.find(c => c.url === relayUrl);
                            if (existing) {
                                existing.connected = false;
                            }
                            return updated;
                        });
                        
                        // Attempt to reconnect after 10 seconds
                        setTimeout(() => {
                            if (!conn.connected) {
                                connectToSingleRelay(relayUrl, index);
                            }
                        }, 10000);
                    };
                    
                    newConnections.push(conn);
                });
                
                setConnections(newConnections);
            };

            const connectToSingleRelay = (relayUrl, index) => {
                const websocket = new WebSocket(relayUrl);
                
                websocket.onopen = () => {
                    setConnections(prev => {
                        const updated = [...prev];
                        const existing = updated.find(c => c.url === relayUrl);
                        if (existing) {
                            existing.ws = websocket;
                            existing.connected = true;
                        }
                        return updated;
                    });
                    
                    const subscription = JSON.stringify([
                        "REQ",
                        `nip34-sub-${index}`,
                        {
                            "kinds": [30617],
                            "limit": 50
                        }
                    ]);
                    websocket.send(subscription);
                };

                websocket.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        if (message[0] === 'EVENT' && message[2]) {
                            const nostrEvent = message[2];
                            if (nostrEvent.kind === 30617) {
                                setEvents(prev => {
                                    const exists = prev.some(e => e.id === nostrEvent.id);
                                    if (exists) return prev;
                                    
                                    const newEvents = [nostrEvent, ...prev];
                                    return newEvents.sort((a, b) => b.created_at - a.created_at);
                                });
                            }
                        }
                    } catch (err) {
                        console.error('Error parsing message:', err);
                    }
                };

                websocket.onerror = () => {
                    setConnections(prev => {
                        const updated = [...prev];
                        const existing = updated.find(c => c.url === relayUrl);
                        if (existing) {
                            existing.connected = false;
                        }
                        return updated;
                    });
                };

                websocket.onclose = () => {
                    setConnections(prev => {
                        const updated = [...prev];
                        const existing = updated.find(c => c.url === relayUrl);
                        if (existing) {
                            existing.connected = false;
                        }
                        return updated;
                    });
                    
                    setTimeout(() => {
                        connectToSingleRelay(relayUrl, index);
                    }, 10000);
                };
            };

            const parseRepoInfo = (event) => {
                const tags = event.tags || [];
                const info = {
                    name: event.content || '',
                    description: event.content || '',
                    url: '',
                    website: '',
                    maintainers: []
                };

                tags.forEach(tag => {
                    if (tag[0] === 'name' && tag[1]) {
                        info.name = tag[1];
                    } else if (tag[0] === 'd' && tag[1]) {
                        if (!info.name) info.name = tag[1];
                    } else if (tag[0] === 'r' && tag[1]) {
                        info.url = tag[1];
                    } else if (tag[0] === 'web' && tag[1]) {
                        info.website = tag[1];
                    } else if (tag[0] === 'p' && tag[1]) {
                        info.maintainers.push(tag[1]);
                    }
                });

                // Use event content as name if no name tag is found
                if (!info.name && event.content) {
                    info.name = event.content;
                }

                return info;
            };

            const formatTime = (timestamp) => {
                return new Date(timestamp * 1000).toLocaleString();
            };

            const getStatusMessage = () => {
                const connectedCount = connections.filter(c => c.connected).length;
                const totalCount = connections.length;
                
                if (status === 'connecting' && connectedCount === 0) {
                    return 'Connecting to relays...';
                } else if (connectedCount > 0) {
                    return `Connected to ${connectedCount}/${totalCount} relays`;
                } else if (totalCount > 0) {
                    return 'Connection error - attempting to reconnect...';
                } else {
                    return 'Initializing...';
                }
            };

            return html`
                <div class="container">
                    <div class="header">
                        <h1>NIP-34 Repository Events</h1>
                        <p>Displaying Git repository announcements from Nostr</p>
                    </div>
                    
                    <div class="status ${status}">
                        ${getStatusMessage()}
                    </div>

                    ${events.length === 0 && status === 'connected' && html`
                        <div class="no-events">
                            <h3>No NIP-34 events found yet</h3>
                            <p>Listening for repository announcements...</p>
                        </div>
                    `}
                    
                    ${events.length === 0 && status === 'connecting' && html`
                        <div class="loading">
                            <h3>Loading events...</h3>
                            <p>Connecting to relay and fetching repository data</p>
                        </div>
                    `}

                    <div class="events">
                        ${events.map(event => {
                            const repo = parseRepoInfo(event);
                            return html`
                                <div key=${event.id} class="event">
                                    <div class="event-header">
                                        <div class="event-id">
                                            ID: ${event.id.substring(0, 16)}...
                                        </div>
                                        <div class="event-time">
                                            ${formatTime(event.created_at)}
                                        </div>
                                    </div>
                                    
                                    <div class="repo-info">
                                        ${repo.name && html`
                                            <div class="repo-name">${repo.name}</div>
                                        `}
                                        
                                        ${repo.description && html`
                                            <div class="repo-description">${repo.description}</div>
                                        `}
                                        
                                        ${repo.website && html`
                                            <div>
                                                <a href=${repo.website} target="_blank" class="repo-url">
                                                    ${repo.website}
                                                </a>
                                            </div>
                                        `}
                                        
                                        ${repo.url && html`
                                            <div>
                                                <strong>Repository:</strong>
                                                <a href=${repo.url} target="_blank" class="repo-url">
                                                    ${repo.url}
                                                </a>
                                            </div>
                                        `}
                                        
                                        ${repo.maintainers.length > 0 && html`
                                            <div class="maintainers">
                                                <strong>Maintainers:</strong>
                                                ${repo.maintainers.map(pubkey => html`
                                                    <span key=${pubkey} class="maintainer">
                                                        ${pubkey.substring(0, 8)}...
                                                    </span>
                                                `)}
                                            </div>
                                        `}
                                    </div>
                                    
                                    ${event.tags && event.tags.length > 0 && html`
                                        <div class="tags">
                                            ${event.tags.map((tag, i) => html`
                                                <span key=${i} class="tag">
                                                    ${tag[0]}: ${tag[1] ? tag[1].substring(0, 20) : ''}${tag[1] && tag[1].length > 20 ? '...' : ''}
                                                </span>
                                            `)}
                                        </div>
                                    `}
                                </div>
                            `;
                        })}
                    </div>
                </div>
            `;
        }

        render(html`<${App} />`, document.getElementById('app'));
    </script>
</body>
</html>
